<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra - Venta MexCars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contacto" id="ct">
        <h3>Ubicación</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3749.6037461710184!2d-99.3610829249982!3d19.983159981417245!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTnCsDU4JzU5LjQiTiA5OcKwMjEnMzAuNiJX!5e0!3m2!1ses-419!2smx!4v1791929950154!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <br>
        <h3>Contactanos para más información</h3>
        <br>
        <form>
            <label for="nm">Nombre:</label>
            <input type="text" name="name" id="nm">
            <br><br>
            <label for="em">Correo Electronico:</label>
            <input type="email" name="email" id="em">
            <br><br>
            <label for="cm">Comentarios:</label>
            <input type="text" name="coment" id="cm">
            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
